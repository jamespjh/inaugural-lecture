# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "teachgrav"
version = "0.0.1"
authors = [
  { name="James Hetherington", email="j.hetherington@ucl.ac.uk" },
]
description = "A pedagogical programming exercise based on a gravity simulation"
readme = "Readme.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "PyYAML",
    "scikit-learn",
    "mlx;platform_system == 'Darwin'", # if on Apple Silicon, MLX

]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-rerunfailures",
    "flake8"
]
numba = [
    "numba"
]
torch = [
    "torch"
]
jax = [
    "jax==0.5.0;platform_system == 'Darwin'",
    "jax-metal==0.1.1;platform_system == 'Darwin'",
    "jax;platform_system != 'Darwin'",
    "jax[cpu];platform_system != 'Darwin'",
    "equinox",
    "diffrax;platform_system != 'Darwin'",
    "diffrax==0.7.2;platform_system == 'Darwin'"
]
cuda = [
    "cupy",
    "jax[cuda13]"
]
quarto = [
    "quarto",
    "quarto-cli"
]

[project.scripts]
teachgrav = "teachgrav.entry:entry"
generate-figures = "teachgrav.generate:generate_figures"

