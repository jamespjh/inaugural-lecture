name: Build and deploy slides

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      
      - name: Install teachgrav
        run: |
          cd demo
          python -m venv venv
          source venv/bin/activate
          pip install -e '.[dev, numba, torch, jax]'
      
      - name: Generate slide assets
        run: |
          source demo/venv/bin/activate
          cd slideshow/assets
          mkdir -p generated
          generate-figures sources/teachgrav/scenarios.yml

      - name: Render DOT diagrams
        run: |
          cd slideshow/assets
          ./sources/graphviz/render_diagrams.sh
      
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      
      - name: Build slides
        run: |
          cd slideshow
          quarto render slides.qmd --to revealjs
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
